<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYJELY Jasun Sosmed</title>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:#111827;
      padding:30px;
      border-radius:20px;
      width:350px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    select,input,button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:10px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    #result{
      margin-top:15px;
      color:#22c55e;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>SKYJELY JASUN</h1>

  <select id="service">
    <option value="1">Followers TikTok</option>
    <option value="2">Likes TikTok</option>
    <option value="3">Views TikTok</option>
  </select>

  <input type="text" id="link" placeholder="Masukkan Link">

  <input type="number" id="qty" placeholder="Jumlah">

  <button onclick="orderNow()">ORDER SEKARANG</button>

  <div id="result"></div>
</div>

<script>
async function orderNow(){

  const service = document.getElementById("service").value;
  const link = document.getElementById("link").value;
  const qty = document.getElementById("qty").value;

  const api_key = "MASUKKAN_API_BARU_KAMU";
  const api_url = "https://domainpanelkamu.com/api/v2";

  const data = new URLSearchParams();
  data.append("key", api_key);
  data.append("action", "add");
  data.append("service", service);
  data.append("link", link);
  data.append("quantity", qty);

  try{

    const response = await fetch(api_url,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:data
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
      "Order berhasil! ID : " + result.order;

  }catch(err){

    document.getElementById("result").innerHTML =
      "Order gagal!";
  }
}
</script>

</body>
</html>
